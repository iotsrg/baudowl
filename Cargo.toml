[package]
name = "baudowl"
version = "1.7.0"
edition = "2021"
rust-version = "1.63"
authors = ["IoTSRG Team"]
description = "The Ultimate Serial Port Detective"
license = "MIT"
repository = "https://github.com/iotsrg/baudowl"

[[bin]]
name = "baudowl"
path = "src/main.rs"

# Version ranges are capped (tilde) to keep the tool buildable on the Rust that
# ships in stable Linux distros (Debian 12 = rustc 1.63). Newer clap/serialport
# releases raise their own MSRV to 1.74+. Cargo.lock pins the exact tested set.
[dependencies]
serialport = "~4.2"
clap = { version = "~4.0", features = ["derive"] }
ctrlc = "~3.2"
colored = "~2.0"
libc = "~0.2"
